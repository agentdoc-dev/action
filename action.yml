name: AgentDoc PR Report
description: >-
  Assesses exact PR revisions against AgentDoc knowledge and posts a sticky
  report with a machine-readable receipt.
author: Alex Bako
branding:
  icon: book-open
  color: purple

outputs:
  assessment-outcome:
    description: Deterministic Change Assessment outcome.
    value: ${{ steps.finalize.outputs.assessment-outcome }}
  assessment-completeness:
    description: Change Assessment completeness.
    value: ${{ steps.finalize.outputs.assessment-completeness }}
  assessment-invocation-id:
    description: Collision-resistant identity for this Action invocation.
    value: ${{ steps.finalize.outputs.assessment-invocation-id }}
  assessment-path:
    description: Absolute path to the exact validated assessment JSON.
    value: ${{ steps.finalize.outputs.assessment-path }}
  assessment-sha256:
    description: SHA-256 of the exact assessment bytes.
    value: ${{ steps.finalize.outputs.assessment-sha256 }}
  assessment-receipt-path:
    description: Absolute path to the Action-owned PR assessment receipt.
    value: ${{ steps.finalize.outputs.assessment-receipt-path }}
  assessment-receipt-sha256:
    description: SHA-256 of the PR assessment receipt.
    value: ${{ steps.finalize.outputs.assessment-receipt-sha256 }}
  semantic-review-path:
    description: Absolute path to the complete cited semantic review artifact.
    value: ${{ steps.finalize.outputs.semantic-review-path }}
  semantic-review-sha256:
    description: SHA-256 of the complete cited semantic review artifact.
    value: ${{ steps.finalize.outputs.semantic-review-sha256 }}
  semantic-assessment-status:
    description: Closed semantic status (`required`, `completed`, `skipped`, `fell_back`, or `failed`).
    value: ${{ steps.finalize.outputs.semantic-assessment-status }}
  baseline-status:
    description: Repository baseline readiness (`ready`, `not_ready`, or `unavailable`).
    value: ${{ steps.finalize.outputs.baseline-status }}
  baseline-path:
    description: Absolute path to the validated repository baseline JSON.
    value: ${{ steps.finalize.outputs.baseline-path }}
  baseline-sha256:
    description: SHA-256 of the exact repository baseline bytes.
    value: ${{ steps.finalize.outputs.baseline-sha256 }}

inputs:
  enforcement:
    description: >-
      `advisory` reports structural invalidity without failing; `strict`
      fails when the selected structural scope contains errors.
    default: advisory
  scope:
    description: >-
      `full` gates on every error in the knowledge base; `diff` gates only on
      errors in files changed by the pull request (the full report is always
      posted).
    default: full
  report-style:
    description: >-
      Advisory disposition layout: `compact` bullets, `table` rows, or
      `detailed` records with source and content hashes.
    default: compact
  adoc-version:
    description: >-
      adoc release tag to install. The default is the version this action
      release was tested against; `latest` is accepted but not recommended
      for pinning.
    default: v0.3.4
  sync-policy:
    description: >-
      `advisory` reports knowledge drift; `required` fails until the baseline
      is ready and any delivered follow-up knowledge PR is merged.
    default: advisory
  bootstrap:
    description: >-
      On `workflow_dispatch`, assess the checked-out default branch as a
      repository-wide bootstrap and maintain the next bounded
      `adoc/bootstrap/<assessed-head>` draft PR.
    default: "false"
  working-directory:
    description: Directory from which `agentdoc.config.yaml` discovery starts.
    default: "."
  comment:
    description: >-
      Set `false` to skip the sticky pull request comment (annotations and
      the job summary are still produced). Use this when several jobs in one
      workflow run the action, so only one of them comments.
    default: "true"
  comment-max-comments:
    description: >-
      Maximum AgentDoc report comments, including the primary sticky comment.
      Use a positive integer or `unlimited`.
    default: "5"
  github-token:
    description: >-
      Token used to download adoc, update the sticky report, and perform an
      explicitly selected governed delivery.
    default: ${{ github.token }}
  cloud-work-request:
    description: >-
      Path to one canonical adoc.work_request.v0 envelope. Empty disables the
      source-CI Cloud hand-off.
    default: ""
  cloud-upload-url:
    description: Exact HTTPS Workspace external-work result endpoint.
    default: ""
  cloud-upload-token:
    description: >-
      Scoped, expiring Workspace upload credential. It must be distinct from
      the GitHub token and model-provider credentials.
    default: ""
  semantic-review:
    description: >-
      Experimental model-assisted cited review of PR diff and selected
      AgentDoc knowledge. Advisory only and may send repository data to the
      configured provider.
    default: "false"
  propose:
    description: >-
      Build canonical create or update AgentDoc patches for eligible changed
      paths. On by default; skips when credentials are unavailable or unsafe.
    default: "true"
  propose-provider:
    description: >-
      Proposal engine. Only `claude-code` is implemented; other values fail
      the job.
    default: claude-code
  propose-delivery:
    description: >-
      Delivery mode. `comment` is read-only; `commit` fast-forwards a
      same-repository source PR; `pr` maintains one owned follow-up PR.
    default: comment
  propose-on-error:
    description: >-
      `warn` keeps the job green when semantic review or proposal generation
      fails; `fail` fails the job after the report and receipt are finalized.
    default: warn
  propose-max-paths:
    description: >-
      Maximum selected paths sent to the model in one bounded call or
      bootstrap batch.
    default: "10"
  propose-coverage:
    description: >-
      `bounded` reviews up to `propose-max-paths`; `full` reviews every
      non-excluded changed path in one complete review.
    default: bounded
  propose-authority:
    description: >-
      Existing-object policy: `downgrade` moves changed authoritative
      knowledge back to review, `preserve` retains its status, and `suggest`
      renders updates without delivering them.
    default: downgrade
  propose-contradictions:
    description: >-
      `suggest` keeps contradiction lifecycle changes advisory; `propose`
      permits evidence-backed resolution patches behind the pull-request gate.
    default: suggest
  propose-delivery-policy:
    description: >-
      `atomic` delivers only a complete proposal set; `partial` delivers
      validated updates and prominently reports every omission.
    default: atomic
  provider-timeout-seconds:
    description: >-
      Maximum wall time for the optional model provider call, from 60 through
      3600 seconds. The caller's job timeout must leave time for finalization.
    default: "600"
  model:
    description: Model used for cited review and canonical patch candidates.
    default: claude-sonnet-5
  claude-code-version:
    description: >-
      Claude Code native package version installed when proposing. Only the
      bundled version with its pinned SHA-512 integrity is accepted.
    default: "2.1.215"
  claude-code-oauth-token:
    description: >-
      Claude subscription token from `claude setup-token`, stored as a repo
      secret. Alternative to anthropic-api-key.
    default: ""
  anthropic-api-key:
    description: >-
      Anthropic API key for proposals. Takes precedence over
      claude-code-oauth-token when both are set.
    default: ""

runs:
  using: composite
  steps:
    - name: Validate Action invocation
      shell: bash
      env:
        INPUT_ENFORCEMENT: ${{ inputs.enforcement }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_REPORT_STYLE: ${{ inputs.report-style }}
        INPUT_ADOC_VERSION: ${{ inputs.adoc-version }}
        INPUT_SYNC_POLICY: ${{ inputs.sync-policy }}
        INPUT_BOOTSTRAP: ${{ inputs.bootstrap }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_MAX_COMMENTS: ${{ inputs.comment-max-comments }}
        INPUT_SEMANTIC_REVIEW: ${{ inputs.semantic-review }}
        INPUT_PROPOSE: ${{ inputs.propose }}
        INPUT_PROPOSE_PROVIDER: ${{ inputs.propose-provider }}
        INPUT_PROPOSE_DELIVERY: ${{ inputs.propose-delivery }}
        INPUT_PROPOSE_ON_ERROR: ${{ inputs.propose-on-error }}
        INPUT_PROPOSE_MAX_PATHS: ${{ inputs.propose-max-paths }}
        INPUT_PROPOSE_COVERAGE: ${{ inputs.propose-coverage }}
        INPUT_PROPOSE_AUTHORITY: ${{ inputs.propose-authority }}
        INPUT_PROPOSE_CONTRADICTIONS: ${{ inputs.propose-contradictions }}
        INPUT_PROPOSE_DELIVERY_POLICY: ${{ inputs.propose-delivery-policy }}
        INPUT_PROVIDER_TIMEOUT_SECONDS: ${{ inputs.provider-timeout-seconds }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        INPUT_CLOUD_WORK_REQUEST: ${{ inputs.cloud-work-request }}
        INPUT_CLOUD_UPLOAD_URL: ${{ inputs.cloud-upload-url }}
        INPUT_CLOUD_UPLOAD_TOKEN: ${{ inputs.cloud-upload-token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/preflight.sh"'

    - name: Install adoc
      if: env.ADOC_PIPELINE_READY == 'true'
      shell: bash
      env:
        ADOC_VERSION: ${{ inputs.adoc-version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/install.sh"'

    - name: Register problem matcher
      if: env.ADOC_PIPELINE_READY == 'true'
      shell: bash
      run: echo "::add-matcher::${GITHUB_ACTION_PATH}/problem-matcher.json"

    - name: Prepare bootstrap source
      if: env.ADOC_PIPELINE_READY == 'true' && inputs.bootstrap == 'true'
      shell: bash
      working-directory: ${{ env.ADOC_WORKING_DIRECTORY }}
      run: '"${GITHUB_ACTION_PATH}/scripts/bootstrap.sh"'

    - name: Run exact-SHA Change Assessment
      if: env.ADOC_PIPELINE_READY == 'true'
      shell: bash
      working-directory: ${{ env.ADOC_WORKING_DIRECTORY }}
      run: '"${GITHUB_ACTION_PATH}/scripts/report.sh"'

    - name: Inventory repository baseline
      if: env.ADOC_ASSESSMENT_VALID == 'true'
      shell: bash
      working-directory: ${{ env.ADOC_WORKING_DIRECTORY }}
      run: '"${GITHUB_ACTION_PATH}/scripts/baseline.sh"'

    - name: Remove problem matcher
      if: always()
      shell: bash
      run: echo "::remove-matcher owner=adoc::"

    - name: Install model provider
      if: >-
        env.ADOC_ASSESSMENT_VALID == 'true' &&
        (inputs.semantic-review == 'true' || inputs.propose == 'true') &&
        env.ADOC_PROPOSE_ELIGIBLE == 'true' &&
        (inputs.anthropic-api-key != '' || inputs.claude-code-oauth-token != '')
      shell: bash
      run: |
        mkdir -p "$ADOC_RUN_DIR/provider-install-home"
        if ! env -i HOME="$ADOC_RUN_DIR/provider-install-home" PATH=/usr/bin:/bin LANG=C LC_ALL=C \
          "${GITHUB_ACTION_PATH}/scripts/install-provider.sh" \
          "${{ inputs.claude-code-version }}" "$ADOC_RUN_DIR/provider"; then
          echo '::warning::AgentDoc: model provider installation failed; optional-stage policy will decide the final gate'
        fi

    # pull_request only: pull_request_target runs untrusted PR content with
    # secrets in scope — exactly the blast radius proposals must avoid.
    - name: Run cited semantic review
      if: >-
        env.ADOC_ASSESSMENT_VALID == 'true' &&
        (inputs.semantic-review == 'true' || inputs.propose == 'true')
      shell: bash
      working-directory: ${{ env.ADOC_WORKING_DIRECTORY }}
      env:
        SEMANTIC_REVIEW: ${{ inputs.semantic-review }}
        PROPOSE: ${{ inputs.propose }}
        PROPOSE_ON_ERROR: ${{ inputs.propose-on-error }}
        PROPOSE_MAX_PATHS: ${{ inputs.propose-max-paths }}
        PROPOSE_COVERAGE: ${{ inputs.propose-coverage }}
        PROPOSE_AUTHORITY: ${{ inputs.propose-authority }}
        PROPOSE_CONTRADICTIONS: ${{ inputs.propose-contradictions }}
        PROPOSE_DELIVERY_POLICY: ${{ inputs.propose-delivery-policy }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
        PROVIDER_TIMEOUT_SECONDS: ${{ inputs.provider-timeout-seconds }}
        MODEL: ${{ inputs.model }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/semantic-review.sh"'

    - name: Propose Knowledge Objects
      if: env.ADOC_ASSESSMENT_VALID == 'true' && inputs.propose == 'true'
      shell: bash
      working-directory: ${{ env.ADOC_WORKING_DIRECTORY }}
      env:
        PROPOSE_ON_ERROR: ${{ inputs.propose-on-error }}
        PROPOSE_AUTHORITY: ${{ inputs.propose-authority }}
        PROPOSE_CONTRADICTIONS: ${{ inputs.propose-contradictions }}
        PROPOSE_DELIVERY_POLICY: ${{ inputs.propose-delivery-policy }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
      run: '"${GITHUB_ACTION_PATH}/scripts/propose.sh"'

    - name: Deliver drafts
      if: env.ADOC_ASSESSMENT_VALID == 'true' && inputs.propose == 'true' && inputs.propose-delivery != 'comment'
      shell: bash
      working-directory: ${{ env.ADOC_WORKING_DIRECTORY }}
      env:
        PROPOSE_DELIVERY: ${{ inputs.propose-delivery }}
        PROPOSE_DELIVERY_POLICY: ${{ inputs.propose-delivery-policy }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ env.ADOC_HEAD_REF }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
      run: '"${GITHUB_ACTION_PATH}/scripts/deliver.sh"'

    - name: Hand off exact external work result
      if: >-
        env.ADOC_ASSESSMENT_VALID == 'true' &&
        inputs.cloud-work-request != '' &&
        inputs.cloud-upload-url != '' &&
        inputs.cloud-upload-token != ''
      shell: bash
      env:
        CLOUD_WORK_REQUEST: ${{ inputs.cloud-work-request }}
        CLOUD_UPLOAD_URL: ${{ inputs.cloud-upload-url }}
        CLOUD_UPLOAD_TOKEN: ${{ inputs.cloud-upload-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ADOC_ACTION_REF: ${{ github.action_ref }}
      run: '"${GITHUB_ACTION_PATH}/scripts/upload-cloud-result.sh"'

    - name: Finalize assessment receipt
      id: finalize
      if: always()
      shell: bash
      env:
        ENFORCEMENT: ${{ inputs.enforcement }}
        SCOPE: ${{ inputs.scope }}
        SEMANTIC_REVIEW: ${{ inputs.semantic-review }}
        PROPOSE: ${{ inputs.propose }}
        PROPOSE_ON_ERROR: ${{ inputs.propose-on-error }}
        PROPOSE_DELIVERY: ${{ inputs.propose-delivery }}
        SYNC_POLICY: ${{ inputs.sync-policy }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
        ADOC_ACTION_REF: ${{ github.action_ref }}
        CLOUD_SYNC_REQUESTED: ${{ inputs.cloud-work-request != '' }}
      run: '"${GITHUB_ACTION_PATH}/scripts/finalize.sh"'

    - name: Compose report
      if: always()
      shell: bash
      env:
        ENFORCEMENT: ${{ inputs.enforcement }}
        SCOPE: ${{ inputs.scope }}
        SEMANTIC_REVIEW: ${{ inputs.semantic-review }}
        PROPOSE: ${{ inputs.propose }}
        PROPOSE_DELIVERY: ${{ inputs.propose-delivery }}
        SYNC_POLICY: ${{ inputs.sync-policy }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
        REPORT_STYLE: ${{ inputs.report-style }}
        ADOC_VERSION: ${{ inputs.adoc-version }}
        ADOC_ACTION_REF: ${{ github.action_ref }}
      run: '"${GITHUB_ACTION_PATH}/scripts/compose.sh"'

    - name: Finalize bounded report
      if: always()
      shell: bash
      env:
        COMMENT_MAX_COMMENTS: ${{ inputs.comment-max-comments }}
      run: '"${GITHUB_ACTION_PATH}/scripts/finalize-report.sh"'

    - name: Write job summary
      if: always()
      shell: bash
      run: cat "$ADOC_RUN_DIR/job-summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upsert pull request comment
      if: always() && github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: '"${GITHUB_ACTION_PATH}/scripts/comment.sh"'

    - name: Enforce
      if: always()
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/scripts/enforce.sh"'

    - name: Remove private proposal state
      if: always()
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/scripts/cleanup.sh"'
